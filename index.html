<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>CUBE AI</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#080808;--bg2:#111111;--bg3:#1a1a1a;--bg4:#222222;
  --w:#ffffff;--g1:#e0e0e0;--g2:#888888;--g3:#444444;--g4:#2a2a2a;
  --border:1px solid #2a2a2a;--border-w:1px solid #ffffff;
  --fd:'Orbitron',monospace;--fb:'Rajdhani',sans-serif;
  --cW:#ffffff;--cY:#ffd700;--cG:#00c853;--cB:#2979ff;--cR:#f44336;--cO:#ff6d00;--cX:#1e1e1e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:var(--bg);color:var(--w);font-family:var(--fb);overflow:hidden;user-select:none;}
#app{width:100%;height:100%;position:relative;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.screen.active{display:flex;}

/* GRID BG */
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.012) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.012) 1px,transparent 1px);background-size:40px 40px;}

/* HAMBURGER */
#hamburger{position:fixed;top:16px;left:16px;z-index:1000;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer;padding:4px;}
#hamburger span{display:block;height:2px;background:var(--w);transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
#hamburger.open span:nth-child(1){transform:translateY(8px) rotate(45deg);}
#hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
#hamburger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

/* DRAWER */
#drawer{position:fixed;inset:0;z-index:999;pointer-events:none;}
#drawer-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.75);opacity:0;transition:opacity 0.3s ease;}
#drawer-panel{position:absolute;top:0;left:0;bottom:0;width:280px;background:var(--bg2);border-right:var(--border);transform:translateX(-100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;padding:60px 0 40px;}
#drawer.open{pointer-events:all;}
#drawer.open #drawer-overlay{opacity:1;}
#drawer.open #drawer-panel{transform:translateX(0);}
.drawer-logo{padding:0 28px 8px;font-family:var(--fd);font-size:22px;font-weight:900;letter-spacing:4px;}
.drawer-tagline{padding:0 28px 28px;font-size:11px;color:var(--g3);letter-spacing:2px;border-bottom:var(--border);margin-bottom:20px;}
.drawer-nav{flex:1;display:flex;flex-direction:column;}
.nav-item{padding:18px 28px;font-family:var(--fb);font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;color:var(--g2);border-left:2px solid transparent;transition:all 0.2s ease;display:flex;align-items:center;gap:16px;}
.nav-item:hover,.nav-item.active{color:var(--w);border-left-color:var(--w);background:rgba(255,255,255,0.03);}
.nav-icon{font-size:16px;width:22px;text-align:center;}
.drawer-footer{padding:20px 28px 0;border-top:var(--border);font-size:10px;letter-spacing:1px;color:var(--g3);text-transform:uppercase;}

/* SCREEN HEADER */
.screen-header{padding:16px 20px 16px 64px;border-bottom:var(--border);font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;min-height:56px;flex-shrink:0;}
.header-action{font-family:var(--fb);font-size:11px;letter-spacing:2px;color:var(--g2);cursor:pointer;text-transform:uppercase;padding:6px 12px;border:var(--border);}
.header-action:hover{color:var(--w);border-color:var(--w);}

/* ═══ TIMER ═══ */
#screen-timer{background:var(--bg);align-items:center;justify-content:center;position:relative;}
.timer-scramble{position:absolute;top:0;left:0;right:0;padding:14px 60px;text-align:center;font-family:var(--fb);font-size:13px;font-weight:500;letter-spacing:1.5px;color:var(--g2);border-bottom:var(--border);background:var(--bg);min-height:48px;display:flex;align-items:center;justify-content:center;}
.timer-center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;padding-top:48px;padding-bottom:130px;}
#timer-display{font-family:var(--fd);font-size:clamp(52px,14vw,88px);font-weight:900;letter-spacing:-2px;color:var(--w);transition:color 0.15s ease;position:relative;cursor:default;}
#timer-display.holding{color:#444;}
#timer-display.ready{color:var(--w);}
.timer-glow{position:absolute;inset:-20px;background:radial-gradient(ellipse,rgba(255,255,255,0.03) 0%,transparent 70%);pointer-events:none;}
.timer-hint{margin-top:20px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--g3);transition:opacity 0.3s ease;}
.timer-hint.hidden{opacity:0;}
#inspection-display{position:absolute;top:64px;font-family:var(--fd);font-size:28px;font-weight:700;letter-spacing:2px;color:var(--g2);display:none;}
#bin-btn{position:absolute;right:20px;top:50%;transform:translateY(-60%);width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:var(--border);background:var(--bg2);cursor:pointer;font-size:22px;opacity:0;pointer-events:none;transition:all 0.25s ease;}
#bin-btn.visible{opacity:1;pointer-events:all;}
#bin-btn:hover{border-color:var(--w);}
#stats-bar{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);border-top:var(--border);background:var(--bg2);}
.stat-cell{padding:12px 6px;display:flex;flex-direction:column;align-items:center;border-right:var(--border);}
.stat-cell:last-child{border-right:none;}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--g3);margin-bottom:4px;}
.stat-value{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--g1);}

/* ═══ HISTORY ═══ */
#screen-history{background:var(--bg);}
.history-list{flex:1;overflow-y:auto;}
.history-list::-webkit-scrollbar{width:2px;}
.history-list::-webkit-scrollbar-thumb{background:var(--g3);}
.solve-item{display:grid;grid-template-columns:40px 1fr 1fr auto;align-items:center;padding:14px 20px;border-bottom:var(--border);gap:12px;transition:background 0.15s;}
.solve-item:hover{background:var(--bg3);}
.solve-num{font-size:11px;color:var(--g3);letter-spacing:1px;}
.solve-time{font-family:var(--fd);font-size:16px;font-weight:700;}
.solve-date{font-size:11px;color:var(--g3);}
.solve-del{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--g3);cursor:pointer;font-size:16px;transition:color 0.2s;}
.solve-del:hover{color:var(--w);}
.history-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--g3);}

/* ═══ PRACTICE ═══ */
#screen-practice{background:var(--bg);}
.practice-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:var(--border);flex-shrink:0;}
.ptab{padding:13px 4px;text-align:center;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g3);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.ptab.active{color:var(--w);border-bottom-color:var(--w);}
.practice-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#cube-wrap{width:100%;height:220px;flex-shrink:0;background:var(--bg);position:relative;}
#practice-canvas{width:100%;height:100%;display:block;}
/* move display overlay */
#move-overlay{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:3px;color:var(--w);background:rgba(0,0,0,0.6);padding:4px 16px;opacity:0;transition:opacity 0.2s;pointer-events:none;}
#move-overlay.show{opacity:1;}

.practice-scroll{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.practice-scroll::-webkit-scrollbar{width:2px;}
.stage-card{background:var(--bg2);border:var(--border);padding:14px;}
.stage-card-title{font-family:var(--fd);font-size:13px;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.stage-card-desc{font-size:12px;color:var(--g2);line-height:1.6;}

/* scramble input row */
.sinput-row{display:flex;gap:8px;}
.sinput{flex:1;background:var(--bg3);border:var(--border);padding:11px 12px;color:var(--w);font-family:var(--fb);font-size:13px;letter-spacing:1px;outline:none;}
.sinput:focus{border-color:var(--g2);}
.sinput::placeholder{color:var(--g3);}

/* buttons */
.btn{background:var(--w);color:var(--bg);border:none;padding:11px 16px;font-family:var(--fb);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn:hover{background:var(--g1);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-o{background:transparent;color:var(--w);border:var(--border-w);}
.btn-o:hover{background:var(--w);color:var(--bg);}
.btn-row{display:flex;gap:8px;}
.btn-row .btn,.btn-row .btn-o{flex:1;text-align:center;}

/* section label */
.slabel{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--g3);margin-bottom:6px;}

/* color palette */
.cpalette{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.cswatch{width:30px;height:30px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.cswatch.sel{border-color:var(--w);transform:scale(1.15);box-shadow:0 0 8px rgba(255,255,255,0.3);}
.plabel{font-size:11px;letter-spacing:1px;color:var(--g3);}

/* 2D net */
#net-wrap{background:var(--bg2);border:var(--border);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.net-label{font-size:10px;letter-spacing:2px;color:var(--g3);text-transform:uppercase;align-self:flex-start;}
#cube-net{display:inline-block;}
.net-face{display:inline-grid;grid-template-columns:repeat(3,1fr);gap:2px;}
.net-row{display:flex;gap:6px;align-items:center;justify-content:center;}
.net-cell{width:18px;height:18px;cursor:pointer;transition:all 0.1s;}
.net-cell:hover{opacity:0.8;transform:scale(1.1);}

/* mismatch warning */
#mismatch-warn{display:none;background:rgba(244,67,54,0.15);border:1px solid rgba(244,67,54,0.4);padding:8px 12px;font-size:11px;color:#ff6b6b;letter-spacing:1px;}
#mismatch-warn.show{display:block;}

/* solution panel */
#solution-panel{display:none;background:var(--bg2);border:var(--border);padding:12px;}
#solution-panel.show{display:block;}
.sol-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--g3);margin-bottom:8px;}
.sol-moves{font-family:var(--fd);font-size:13px;letter-spacing:2px;color:var(--w);line-height:1.8;word-break:break-all;}
.sol-move-item{display:inline-block;padding:2px 6px;margin:2px;border:var(--border);transition:all 0.2s;}
.sol-move-item.current{background:var(--w);color:var(--bg);}
.sol-move-item.done{color:var(--g3);border-color:var(--g4);}

/* ═══ SETTINGS ═══ */
#screen-settings{background:var(--bg);}
.settings-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:2px;}
.sgroup-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--g3);padding:16px 0 8px;margin-top:8px;}
.srow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:var(--border);}
.sinfo{flex:1;}
.sname{font-size:14px;font-weight:600;letter-spacing:0.5px;margin-bottom:2px;}
.sdesc{font-size:11px;color:var(--g3);}
.toggle{width:44px;height:24px;position:relative;cursor:pointer;background:var(--bg3);border:var(--border);transition:background 0.2s;flex-shrink:0;}
.toggle.on{background:var(--w);}
.tknob{position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--g3);transition:transform 0.2s,background 0.2s;}
.toggle.on .tknob{transform:translateX(20px);background:var(--bg);}
.ssel{background:var(--bg3);border:var(--border);color:var(--w);padding:8px 12px;font-family:var(--fb);font-size:13px;letter-spacing:1px;outline:none;cursor:pointer;min-width:100px;}

/* ═══ PRIVACY ═══ */
